spring:
  application:
    name: sucremi-server
  datasource:
    # 本地默认值仅为开发便利；生产/真实密码必须通过环境变量注入，禁止写死在此处。
    url: ${SUCREMI_DB_URL:jdbc:mysql://localhost:3306/sucremi?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${SUCREMI_DB_USERNAME:sucremi}
    password: ${SUCREMI_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SUCREMI_SERVER_PORT:8080}

logging:
  level:
    com.sucremi: INFO
